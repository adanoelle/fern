<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 96 96" width="96" height="96">
  <!-- A chrome double arrow with a red heart at its middle. The build
       fills in @turn@, the arrow's angle: 0 is left-right. The heart
       stays upright. -->
  <defs>
    <linearGradient id="chrome" gradientUnits="userSpaceOnUse" x1="0" y1="31" x2="0" y2="65">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.18" stop-color="#eef4ff"/><stop offset="0.36" stop-color="#7f8fb8"/>
      <stop offset="0.46" stop-color="#1b2140"/><stop offset="0.50" stop-color="#2a3360"/><stop offset="0.54" stop-color="#ffffff"/>
      <stop offset="0.70" stop-color="#c9d6ff"/><stop offset="0.86" stop-color="#f6e9ff"/><stop offset="1" stop-color="#8a7fd0"/>
    </linearGradient>
    <radialGradient id="red" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff0ee"/><stop offset="0.3" stop-color="#ff5a52"/><stop offset="0.7" stop-color="#c20d1c"/><stop offset="1" stop-color="#6a0012"/></radialGradient>
    <path id="arrow" stroke-linejoin="round" d="M8 48 L27 31 V42.5 H69 V31 L88 48 L69 65 V53.5 H27 V65 Z"/>
    <path id="heart" stroke-linejoin="round" d="M48 58.2 C33.5 48 36.4 37.2 42.2 37.2 C45.5 37.2 48 39.4 48 42.2 C48 39.4 50.5 37.2 53.8 37.2 C59.6 37.2 62.5 48 48 58.2 Z"/>
  </defs>
  <g transform="rotate(@turn@ 48 48)">
    <use xlink:href="#arrow" stroke="#ffffff" stroke-width="6" fill="#ffffff"/>
    <use xlink:href="#arrow" stroke="#14162a" stroke-width="2.4" fill="url(#chrome)"/>
  </g>
  <use xlink:href="#heart" stroke="#ffffff" stroke-width="5" fill="#ffffff"/>
  <use xlink:href="#heart" stroke="#14162a" stroke-width="2" fill="url(#red)"/>
  <path d="M41.4 43.6 q0.8 -2.6 3 -3" stroke="#ffffff" stroke-width="1.4" fill="none" stroke-linecap="round"/>
</svg>
