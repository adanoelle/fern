         C45.8 34 45.8 24 46 15 C46.1 9.4 48 7 50.8 7 C53.6 7 55.6 9.4 55.8 15 C56 24 56.2 34 56.4 44
         C56.8 35 57.6 26 58.4 19 C59 13.6 61 11.6 63.6 11.8 C66.4 12 68 14.6 67.6 20 C67.2 28 66.8 37 66.6 45.4
         C67.6 39 69.2 33 70.8 28 C72.2 23.6 74.4 22 76.8 22.6 C79.4 23.4 80.4 26.2 79.4 31 C78 38 77 44 76.4 50
         C76.2 56 75.6 61 74.4 65 C72.8 72 69 77.6 64.4 81.4 C63.2 84.6 62.8 87.8 63 91.5 H45.5
         C45.7 88.4 45.3 85.6 44 83 C39.4 79.6 35.6 75 32.4 70 C29 65 23.6 60.6 19.6 56
         C16.8 52.6 17 48.8 19.8 47.4 C22.8 46 26 48 28.8 50.6 C31.6 53.2 34.4 55.4 36 56 Z"/>
