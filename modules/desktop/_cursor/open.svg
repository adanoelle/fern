      <path d="M33.4 41 H47 V47 L40.2 52.6 L33.4 47 Z" fill="url(#ring)"/>
      <path d="M33.6 33.6 H46.6 V39.4 L40 44.6 L33.6 39.4 Z" fill="url(#ring)"/>
      <path d="M33.8 26.6 H46.2 V32 L39.9 36.8 L33.8 32 Z" fill="url(#ring)"/>
      <ellipse cx="51.2" cy="39" rx="6.8" ry="6.4" fill="url(#dome)"/>
      <path d="M57 32.6 q5 -1.5 10.2 0 v3.6 q-5.2 -1.5 -10.2 0 z M56.8 38.4 q5 -1.5 10.2 0 v3.6 q-5.2 -1.5 -10.2 0 z" fill="url(#ring)"/>
      <circle cx="72.8" cy="40.4" r="5" fill="url(#ring)"/>
      <path d="M28.6 50.2 L32.8 53.4 L26.6 64 L22.4 60.8 Z" fill="url(#ring)"/>
