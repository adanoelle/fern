<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.30" stop-color="#cfd8ea"/><stop offset="0.50" stop-color="#1f2748"/>
      <stop offset="0.60" stop-color="#ffffff"/><stop offset="1" stop-color="#b9b4f0"/></linearGradient>
    <radialGradient id="dome" cx="0.35" cy="0.3" r="0.8">
