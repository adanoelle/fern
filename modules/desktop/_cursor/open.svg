      <use xlink:href="#nail" transform="translate(50.8 18) scale(0.8) translate(-43.3 -16.6)"/>
      <use xlink:href="#nail" transform="translate(63.2 22.4) rotate(4) scale(0.78) translate(-43.3 -16.6)"/>
      <use xlink:href="#nail" transform="translate(75.2 32) rotate(14) scale(0.7) translate(-43.3 -16.6)"/>
    </g>
    <use xlink:href="#jewels" stroke="#14162a" stroke-width="1.8"/>
    <circle cx="72.8" cy="40.4" r="3.2" fill="url(#red)" stroke="#14162a" stroke-width="1"/>
    <path d="M48 35.6 q1.9 -2.3 4.3 -1" stroke="#ffffff" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path transform="translate(54.4,90.6) scale(0.42)" d="M0 6 C-10 -1 -8 -8.5 -4 -8.5 C-1.7 -8.5 0 -7 0 -5 C0 -7 1.7 -8.5 4 -8.5 C8 -8.5 10 -1 0 6 Z" fill="#d40f1f" stroke="#14162a" stroke-width="2.4" stroke-linejoin="round"/>
  </g>
  <path d="M87 11 l1.9 5.3 5.3 1.9 -5.3 1.9 -1.9 5.3 -1.9 -5.3 -5.3 -1.9 5.3 -1.9 z" fill="#ffffff" stroke="#14162a" stroke-width="1.1" stroke-linejoin="round"/>
