    <path d="M36 56 C38.4 58.4 40.2 61 41.2 64.4" fill="none" stroke="#14162a" stroke-width="1.6" stroke-linecap="round"/>
    <g fill="#b3122a" stroke="#14162a" stroke-width="1.1">
