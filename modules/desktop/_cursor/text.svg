    </g>
  </defs>
  <use xlink:href="#art" stroke="#ffffff" stroke-width="6" fill="#ffffff"/>
  <use xlink:href="#art" stroke="#14162a" stroke-width="2.4"/>
  <path d="M45.4 46 q1.4 -1.8 3.2 -0.8" stroke="#ffffff" stroke-width="1.2" fill="none" stroke-linecap="round"/>
