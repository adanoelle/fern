<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#cfd8ea"/>
      <stop offset="0.52" stop-color="#1f2748"/>
      <stop offset="0.62" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9b4f0"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3e0"/>
      <stop offset="0.3" stop-color="#ff5a52"/>
      <stop offset="0.6" stop-color="#d40f1f"/>
      <stop offset="1" stop-color="#8f0018"/>
    </linearGradient>
    <g id="art" stroke-linejoin="round" stroke-linecap="round">
      <!-- a slim beam with small serifs; the click point is its centre -->
