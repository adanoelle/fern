<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.30" stop-color="#cfd8ea"/><stop offset="0.50" stop-color="#1f2748"/>
      <stop offset="0.60" stop-color="#ffffff"/><stop offset="1" stop-color="#b9b4f0"/></linearGradient>
    <radialGradient id="dome" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.25" stop-color="#e6ecff"/><stop offset="0.55" stop-color="#7f8fb8"/>
      <stop offset="0.75" stop-color="#232a4a"/><stop offset="0.9" stop-color="#c9d6ff"/><stop offset="1" stop-color="#8a7fd0"/></radialGradient>
    <radialGradient id="red" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff0ee"/><stop offset="0.3" stop-color="#ff5a52"/><stop offset="0.7" stop-color="#c20d1c"/><stop offset="1" stop-color="#6a0012"/></radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe6d8"/><stop offset="0.6" stop-color="#f3cfbe"/><stop offset="1" stop-color="#e2ab98"/></linearGradient>
    <!-- a closed right fist seen from the back: four knuckles, the thumb
         lying up along the side of the first finger, a slim wrist -->
    <path id="hand" stroke-linejoin="round" stroke-linecap="round"
      d="M26.8 41.6 C27.6 34.4 31 31.4 34.5 31.4 C37.6 31.4 39.6 33.4 40.4 36
         C41.2 31.6 43.8 29.4 47 29.4 C50.2 29.4 52.6 31.6 53.4 35.6 C54.4 32.4 56.8 30.6 59.8 30.6
         C63 30.6 65.2 32.8 65.8 36.8 C66.8 34.6 68.8 33.4 71 33.6 C74.4 34 76 37 75.8 41.4
         C75.6 48 75.4 54 74.2 60 C73 67.4 69.4 72.6 65 76 C63.8 79.6 63.4 83.4 63.6 88 H45
         C45.2 84.4 44.8 81.2 43.4 78.4 C37.6 75.4 32.6 70.4 29 64.6 C24.6 59.4 20.4 53 19.8 47
         C19.4 42.6 21.8 39.8 24.6 40 C25.6 40.1 26.4 40.7 26.8 41.6 Z"/>
    <g id="jewels" stroke-linejoin="round" stroke-linecap="round">
      <!-- the four rings in a row across the knuckles -->
      <path d="M25.4 43 H41.4 V48.4 L33.4 54 L25.4 48.4 Z" fill="url(#ring)"/>
      <path d="M26 36 H40.8 V41.4 L33.4 46.6 L26 41.4 Z" fill="url(#ring)"/>
      <ellipse cx="47" cy="41.6" rx="7.4" ry="6.8" fill="url(#dome)"/>
      <path d="M54.2 38.4 q5.4 -1.6 11.2 0 v3.8 q-5.8 -1.6 -11.2 0 z M54.2 44.4 q5.4 -1.6 11 0 v3.8 q-5.6 -1.6 -11 0 z" fill="url(#ring)"/>
      <circle cx="70.6" cy="43.2" r="5.4" fill="url(#ring)"/>
      <!-- a fine bracelet -->
      <path d="M43.8 79.4 Q54 84 64.4 78.6 L63.9 81.8 Q54 87.2 44.3 82.6 Z" fill="url(#ring)"/>
    </g>
    <path id="thumbring" stroke-linejoin="round" d="M19.4 51.4 L27.6 49.4 L28.6 54.4 L21 56.8 Z" fill="url(#ring)"/>
  </defs>
  <g transform="rotate(-8 48 52)">
    <use xlink:href="#hand" stroke="#ffffff" stroke-width="6" fill="#ffffff"/>
    <use xlink:href="#jewels" stroke="#ffffff" stroke-width="5" fill="#ffffff"/>
    <use xlink:href="#hand" stroke="#14162a" stroke-width="2.4" fill="url(#skin)"/>
    <!-- creases between the fingers, and the line where they tuck under -->
    <g fill="none" stroke="#14162a" stroke-width="1.6" stroke-linecap="round">
      <path d="M40.4 36 C40.6 42 40.4 48 40 53"/>
      <path d="M53.4 35.6 C53.6 42 53.4 48 53 53.6"/>
      <path d="M65.8 36.8 C66 42 65.8 48 65.4 53"/>
      <path d="M26.8 41.6 C27.2 48 28.6 55 31.6 61.4"/>
    </g>
    <use xlink:href="#jewels" stroke="#14162a" stroke-width="1.8"/>
    <circle cx="70.6" cy="43.2" r="3.5" fill="url(#red)" stroke="#14162a" stroke-width="1"/>
    <path d="M43.8 38.2 q2 -2.4 4.6 -1" stroke="#ffffff" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <use xlink:href="#thumbring" stroke="#ffffff" stroke-width="5" fill="#ffffff"/>
    <use xlink:href="#thumbring" stroke="#14162a" stroke-width="1.8"/>
    <path transform="translate(54.2,88.4) scale(0.42)" d="M0 6 C-10 -1 -8 -8.5 -4 -8.5 C-1.7 -8.5 0 -7 0 -5 C0 -7 1.7 -8.5 4 -8.5 C8 -8.5 10 -1 0 6 Z" fill="#d40f1f" stroke="#14162a" stroke-width="2.4" stroke-linejoin="round"/>
  </g>
  <path d="M84 22 l1.9 5.3 5.3 1.9 -5.3 1.9 -1.9 5.3 -1.9 -5.3 -5.3 -1.9 5.3 -1.9 z" fill="#ffffff" stroke="#14162a" stroke-width="1.1" stroke-linejoin="round"/>
</svg>
