# presenterm config — managed by modules/cli/presenterm.nix
defaults:
  theme: shitanuri
  image_protocol: auto

options:
  # A slide title starts a new slide and ends the one before it, so decks
  # need neither <!-- end_slide --> nor `---` between titled slides: a `---`
  # there ends the slide twice and leaves an empty one. `---` still ends a
  # slide that has no title.
  implicit_slide_ends: true
  end_slide_shorthand: true
  incremental_lists: false

snippet:
  exec:
    # Ctrl+E runs `+exec` blocks. This is on because the decks here are
    # our own; pass `-x`/`-X` semantics in mind before presenting someone
    # else's file. `+exec_replace` stays opt-in via `-X`.
    enable: true
