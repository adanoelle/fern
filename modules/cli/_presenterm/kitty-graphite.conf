# Kitty overlay for presenting — graphite profile.
# Merged after kitty.conf by `present --kitty --theme graphite`:
#   kitty --start-as fullscreen --config kitty.conf --config graphite.conf presenterm --theme graphite deck.md

font_family      IBM Plex Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 20
disable_ligatures always
modify_font cell_height 105%

window_padding_width 24 32
confirm_os_window_close 0

cursor #f0b429
cursor_text_color #16181d
cursor_shape block
cursor_blink_interval 0

background #16181d
foreground #e6e1d6
selection_background #34405a
selection_foreground #e6e1d6

color0  #2d333b
color1  #f47067
color2  #57ab5a
color3  #c69026
color4  #539bf5
color5  #b083f0
color6  #39c5cf
color7  #adbac7
color8  #768390
color9  #ff938a
color10 #6bc46d
color11 #daaa3f
color12 #6cb6ff
color13 #dcbdfb
color14 #56d4dd
color15 #e6e1d6
