# Kitty overlay for presenting — PC-98 profile.
# Merged after kitty.conf by `present --kitty`:
#   kitty --start-as fullscreen --config kitty.conf --config pc98.conf presenterm deck.md
# Kitty implements the text sizing protocol, so presenterm's 2x headings work here.

font_family      Ark Pixel 16px M latin
bold_font        Ark Pixel 16px M latin
italic_font      Ark Pixel 16px M latin
bold_italic_font Ark Pixel 16px M latin
symbol_map U+3000-U+30FF,U+4E00-U+9FFF Ark Pixel 16px M ja
font_size 24
modify_font cell_height 100%

window_padding_width 24 32
confirm_os_window_close 0

cursor #ff9900
cursor_text_color #000000
cursor_shape block
cursor_blink_interval 0.5

background #110022
foreground #ffeecc
selection_background #cc55cc
selection_foreground #000000

color0  #000000
color1  #cc2222
color2  #22aa22
color3  #bb5500
color4  #0033aa
color5  #880088
color6  #007788
color7  #ccbbcc
color8  #666666
color9  #ff4444
color10 #55dd55
color11 #ffff55
color12 #1188ff
color13 #cc55cc
color14 #55ccdd
color15 #ffeecc
