# Kitty overlay for presenting — shitanuri profile.
# Merged after kitty.conf by `present --kitty --theme shitanuri`:
#   kitty --start-as fullscreen --config kitty.conf --config shitanuri.conf presenterm --theme shitanuri deck.md

font_family      IBM Plex Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 20
disable_ligatures always
modify_font cell_height 105%

window_padding_width 24 32
confirm_os_window_close 0

cursor #cfab70
cursor_text_color #1f1a13
cursor_shape block
cursor_blink_interval 0

background #1f1a13
foreground #ddd3b4
selection_background #4b4433
selection_foreground #ddd3b4

color0  #2e271d
color1  #d0805c
color2  #94a587
color3  #cfab70
color4  #8fa9a5
color5  #c3958c
color6  #a2b8ab
color7  #b8b092
color8  #999277
color9  #dc9473
color10 #a7b69a
color11 #dabb86
color12 #a4bcb8
color13 #d0a79f
color14 #b6c8bd
color15 #ddd3b4
